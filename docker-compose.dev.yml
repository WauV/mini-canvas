name: mini-canvas-test

services:
  couchdb-test:
    image: couchdb:3
    container_name: mini-canvas-couchdb-test
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    ports:
      - "127.0.0.1:${COUCHDB_PORT:-5984}:5984"
    volumes:
      - couchdb-test-data:/opt/couchdb/data

volumes:
  couchdb-test-data:
    name: mini-canvas-couchdb-test-data
